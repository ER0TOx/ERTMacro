<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- ฐานปุ่มสีเทาคลาสสิก -->
  <rect x="0" y="0" width="48" height="48" fill="#C0C0C0" />

  <!-- ขอบนูน 3D สไตล์ Retro (แสงตกกระทบ บน-ซ้าย) -->
  <path d="M0 0 H48 V2 H2 V48 H0 Z" fill="#FFFFFF" />
  <path d="M2 2 H46 V4 H4 V46 H2 Z" fill="#DFDFDF" />

  <!-- ขอบนูน 3D สไตล์ Retro (เงา ล่าง-ขวา) -->
  <path d="M4 44 H44 V4 H46 V46 H4 Z" fill="#808080" />
  <path d="M2 46 H48 V0 H46 V46 H0 V48 H48 Z" fill="#000000" />

  <!-- เงากล่องฟลอปปี้ -->
  <rect x="10" y="9" width="29" height="31" fill="#FFFFFF" transform="translate(1, 1)" />

  <!-- ตัวกล่องฟลอปปี้สีน้ำเงินเข้ม -->
  <rect x="10" y="8" width="28" height="31" fill="#000080" />

  <!-- ป้ายกระดาษด้านบน -->
  <rect x="17" y="8" width="14" height="12" fill="#FFFFFF" />
  <rect x="22" y="8" width="5" height="12" fill="#202020" />

  <!-- ป้ายกระดาษด้านล่าง -->
  <rect x="15" y="25" width="18" height="14" fill="#FFFFFF" />
  <rect x="18" y="28" width="12" height="2" fill="#606060" />
  <rect x="18" y="33" width="12" height="2" fill="#606060" />

  <!-- เส้นขอบดำ -->
  <rect x="10" y="8" width="28" height="31" fill="none" stroke="#000000" stroke-width="2" />
</svg>
