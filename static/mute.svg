<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- ฐานปุ่มสีเทาคลาสสิก -->
  <rect x="0" y="0" width="32" height="32" fill="#c0c0c0" />

  <!-- ขอบนูน 3D (แสงตกกระทบ บน-ซ้าย) -->
  <path d="M0 0 H32 V2 H2 V32 H0 Z" fill="#ffffff" />

  <!-- ขอบนูน 3D (เงา ล่าง-ขวา) -->
  <path d="M2 30 H30 V2 H32 V32 H0 V30 Z" fill="#000000" />
  <path d="M2 28 H28 V4 H30 V30 H2 Z" fill="#808080" />

  <!-- ตัวลำโพง (Speaker Body) -->
  <!-- ส่วนสี่เหลี่ยมด้านท้ายลำโพง -->
  <rect x="6" y="12" width="4" height="8" fill="#000000" />
  <rect x="7" y="13" width="3" height="6" fill="#404040" />

  <!-- กรวยลำโพง (Cone) -->
  <polygon points="10,12 15,8 16,8 16,24 15,24 10,20" fill="#000000" />
  <polygon points="11,13 14,10 15,10 15,22 14,22 11,19" fill="#808080" />
  <!-- ไฮไลต์บนกรวยลำโพง -->
  <polygon points="11,13 14,10 15,10 15,14" fill="#dfdfdf" />

  <!-- คลื่นเสียงด้านหน้า (Sound Waves สีน้ำเงินคลาสสิก) -->
  <!-- คลื่นชั้นที่ 1 (ใกล้) -->
  <rect x="19" y="12" width="2" height="8" fill="#000080" />
  <rect x="18" y="10" width="2" height="2" fill="#000080" />
  <rect x="18" y="20" width="2" height="2" fill="#000080" />

  <!-- คลื่นชั้นที่ 2 (ไกล) -->
  <rect x="23" y="10" width="2" height="12" fill="#000080" />
  <rect x="22" y="7" width="2" height="3" fill="#000080" />
  <rect x="22" y="22" width="2" height="3" fill="#000080" />
</svg>
