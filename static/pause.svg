<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- ฐานปุ่มสีเทาคลาสสิก -->
  <rect x="0" y="0" width="48" height="48" fill="#C0C0C0" />
  
  <!-- ขอบนูน 3D สไตล์ Retro (แสงตกกระทบ บน-ซ้าย) -->
  <path d="M0 0 H48 V2 H2 V48 H0 Z" fill="#FFFFFF" />
  <path d="M2 2 H46 V4 H4 V46 H2 Z" fill="#DFDFDF" />
  
  <!-- ขอบนูน 3D สไตล์ Retro (เงา ล่าง-ขวา) -->
  <path d="M4 44 H44 V4 H46 V46 H4 Z" fill="#808080" />
  <path d="M2 46 H48 V0 H46 V46 H0 V48 H48 Z" fill="#000000" />
  
  <!-- ไอคอน Pause (แถบคู่) พร้อมเงาสไตล์ Retro -->
  <!-- เงาสีขาว -->
  <rect x="18" y="15" width="5" height="20" fill="#FFFFFF" />
  <rect x="28" y="15" width="5" height="20" fill="#FFFFFF" />
  <!-- แท่งคู่สีดำคมชัด -->
  <rect x="17" y="14" width="5" height="20" fill="#000000" />
  <rect x="27" y="14" width="5" height="20" fill="#000000" />
</svg>
