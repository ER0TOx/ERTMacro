<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Popup</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #008080;
      font-family: 'Tahoma', 'Segoe UI', 'MS Sans Serif', Geneva, sans-serif;
      font-size: 11px;
    }

    .bevel-raised {
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset 1px 1px 0px #dfdfdf, inset -1px -1px 0px #808080;
    }

    .bevel-sunken {
      background: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px 0px #000000;
    }

    .retro-titlebar {
      background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
      color: #ffffff;
      font-weight: bold;
      padding: 4px 6px;
      letter-spacing: 0.5px;
    }

    .dialog {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      bottom: 14px;
      padding: 3px;
      display: flex;
      flex-direction: column;
    }

    .dialog-body {
      flex: 1;
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      overflow: auto;
    }

    .dialog-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border-radius: 50%;
      background: #000080;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: inset 1px 1px 0px #000000;
    }

    .dialog-icon.warn {
      background: #c06000;
    }

    .dialog-message {
      font-size: 12px;
      line-height: 1.5;
      color: #000000;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .dialog-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 10px 12px 10px;
    }

    .dialog-btn {
      min-width: 92px;
      height: 26px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .dialog-btn:active {
      border-top: 2px solid #000000;
      border-left: 2px solid #000000;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px 0px #808080;
    }

    .status {
      text-align: center;
      padding: 0 10px 8px 10px;
      color: #404040;
      display: none;
    }
  </style>
</head>
<body>

  <div class="dialog bevel-raised">
    <div class="retro-titlebar">
      <span id="popup-title">MESSAGE</span>
    </div>
    <div class="dialog-body">
      <div class="dialog-icon" id="popup-icon">i</div>
      <div class="dialog-message" id="popup-message">...</div>
    </div>
    <div class="status" id="popup-status">ส่งคำตอบแล้ว กำลังปิดหน้าต่างอัตโนมัติ</div>
    <div class="dialog-actions" id="popup-actions"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const kind = params.get('kind') === 'confirm' ? 'confirm' : 'alert';
    const popupId = params.get('id') || '';
    const message = params.get('message') || '';

    const titleEl = document.getElementById('popup-title');
    const iconEl = document.getElementById('popup-icon');
    const messageEl = document.getElementById('popup-message');
    const actionsEl = document.getElementById('popup-actions');
    const statusEl = document.getElementById('popup-status');

    titleEl.textContent = kind === 'confirm' ? 'CONFIRM' : 'ALERT';
    document.title = kind === 'confirm' ? 'CONFIRM' : 'ALERT';
    iconEl.textContent = kind === 'confirm' ? '?' : '!';
    iconEl.className = kind === 'confirm' ? 'dialog-icon' : 'dialog-icon warn';
    messageEl.textContent = message;

    let answered = false;

    function sendResult(value) {
      if (answered) return;
      answered = true;
      statusEl.textContent = 'กำลังปิดหน้าต่าง...';
      statusEl.style.display = 'block';
      actionsEl.style.display = 'none';

      fetch('/api/popup-result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: popupId, value: value })
      }).finally(() => {
        // server สั่งปิดหน้าต่างให้เองแล้ว (close_popup_window)
        setTimeout(() => { try { window.close(); } catch (e) { /* ignore */ } }, 150);
      });
    }

    function addButton(label, value, isDefault) {
      const btn = document.createElement('button');
      btn.className = 'dialog-btn bevel-raised';
      btn.textContent = label;
      btn.addEventListener('click', () => sendResult(value));
      actionsEl.appendChild(btn);
      if (isDefault) setTimeout(() => btn.focus(), 30);
    }

    if (kind === 'confirm') {
      addButton('Confirm', 'confirm', true);
      addButton('Decline', 'decline', false);
    } else {
      addButton('OK', 'ok', true);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendResult(kind === 'confirm' ? 'confirm' : 'ok');
      if (e.key === 'Escape') sendResult(kind === 'confirm' ? 'decline' : 'close');
    });
  </script>
</body>
</html>
